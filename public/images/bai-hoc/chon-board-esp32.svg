    <rect x="230" y="240" width="264" height="40" rx="10"/><rect x="230" y="296" width="264" height="40" rx="10"/><rect x="230" y="352" width="264" height="40" rx="10"/>
    <rect x="544" y="128" width="192" height="40" rx="10"/><rect x="544" y="184" width="192" height="40" rx="10"/>
    <rect x="544" y="240" width="192" height="40" rx="10"/><rect x="544" y="296" width="192" height="40" rx="10"/><rect x="544" y="352" width="192" height="40" rx="10"/>
  </g>
  <rect x="544" y="72" width="192" height="40" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <g fill="#1c2433">
    <text x="246" y="96.5">Mới học, làm dự án chung</text>
    <text x="246" y="152.5">AI, giọng nói, camera, màn hình</text>
    <text x="246" y="208.5">Nhà thông minh, Matter, Zigbee</text>
