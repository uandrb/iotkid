<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" role="img" aria-labelledby="t d" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="13">
  <title id="t">Người mới bắt đầu nên chọn ESP32 hoặc ESP32-C3</title>
  <desc id="d">Chọn board theo dự án: mới học thì ESP32 hoặc ESP32-C3; AI, giọng nói, camera, màn hình thì ESP32-S3; nhà thông minh, Matter, Zigbee thì ESP32-C6; nơi nhiều Wi-Fi cần băng 5 GHz thì ESP32-C5; chạy pin lâu không cần Wi-Fi thì ESP32-H2; màn hình, camera hiệu năng cao thì ESP32-P4 kèm chip Wi-Fi.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3ae"/></marker>
  </defs>
  <rect width="760" height="412" fill="#fbf8f1"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1c2433">Người mới bắt đầu nên chọn ESP32 hoặc ESP32-C3</text>
  <text x="24" y="50" font-size="11.5" fill="#5b6475">Tìm dòng giống dự án của em nhất, đi theo mũi tên để ra board nên mua</text>
  <g fill="none" stroke="#9aa3ae" stroke-width="1.4">
