    <path d="M494 260H540" marker-end="url(#a)"/><path d="M494 316H540" marker-end="url(#a)"/><path d="M494 372H540" marker-end="url(#a)"/>
  </g>
  <rect x="24" y="202" width="150" height="60" rx="10" fill="#ffffff" stroke="#c9c0ad" stroke-width="1.25"/>
  <text x="99" y="228" text-anchor="middle" font-weight="700" fill="#1c2433">Dự án của em</text>
  <text x="99" y="246" text-anchor="middle" font-weight="700" fill="#1c2433">cần gì?</text>
  <g fill="#ffffff" stroke="#c9c0ad" stroke-width="1.25">
