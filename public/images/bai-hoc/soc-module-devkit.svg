<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" role="img" aria-labelledby="t d" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="13">
  <title id="t">Học sinh mua và dùng DevKit, không phải chip trần</title>
  <desc id="d">Ba cấp độ của ESP32: 1. SoC là con chip; 2. Module gồm chip, Flash, thạch anh và anten dưới nắp kim loại; 3. DevKit là module gắn trên bo mạch có cổng USB, nút bấm và chân cắm. Học sinh mua DevKit.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3ae"/></marker>
  </defs>
  <rect width="760" height="306" fill="#fbf8f1"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1c2433">Học sinh mua và dùng DevKit, không phải chip trần</text>
  <g fill="none" stroke="#9aa3ae" stroke-width="1.5">
    <path d="M228 157H276" marker-end="url(#a)"/>
    <path d="M484 157H532" marker-end="url(#a)"/>
  </g>
  <!-- 1. SoC -->
  <rect x="24" y="52" width="200" height="210" rx="10" fill="#ffffff" stroke="#c9c0ad" stroke-width="1.25"/>
  <rect x="94" y="80" width="60" height="60" rx="3" fill="#1c2433"/>
  <g fill="#8a94a6">
    <rect x="99" y="136" width="6" height="4"/><rect x="110" y="136" width="6" height="4"/><rect x="121" y="136" width="6" height="4"/><rect x="132" y="136" width="6" height="4"/><rect x="143" y="136" width="6" height="4"/>
    <rect x="99" y="80" width="6" height="4"/><rect x="110" y="80" width="6" height="4"/><rect x="121" y="80" width="6" height="4"/><rect x="132" y="80" width="6" height="4"/><rect x="143" y="80" width="6" height="4"/>
  </g>
  <text x="124" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">1. SoC (con chip)</text>
  <text x="124" y="206" text-anchor="middle" font-size="11.5" fill="#5b6475">Bộ não: CPU, RAM,</text>
  <text x="124" y="222" text-anchor="middle" font-size="11.5" fill="#5b6475">bộ phát Wi-Fi, Bluetooth</text>
  <text x="124" y="242" text-anchor="middle" font-size="11.5" fill="#5b6475">vỏ QFN, chân nằm dưới đáy</text>
  <!-- 2. Module -->
  <rect x="280" y="52" width="200" height="210" rx="10" fill="#ffffff" stroke="#c9c0ad" stroke-width="1.25"/>
  <rect x="340" y="76" width="80" height="18" fill="#1c2433"/>
  <path d="M346 90V80H354V90H362V80H370V90H378V80H386V90H394V80H402V90H410V80" fill="none" stroke="#d4a017" stroke-width="1.6"/>
  <rect x="340" y="94" width="80" height="48" rx="2" fill="#d5d9df" stroke="#9aa3ae" stroke-width="1.25"/>
  <g fill="#d4a017"><rect x="346" y="142" width="6" height="5"/><rect x="361" y="142" width="6" height="5"/><rect x="376" y="142" width="6" height="5"/><rect x="391" y="142" width="6" height="5"/><rect x="406" y="142" width="6" height="5"/></g>
  <text x="380" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">2. Module</text>
  <text x="380" y="206" text-anchor="middle" font-size="11.5" fill="#5b6475">Chip + Flash + thạch anh</text>
  <text x="380" y="222" text-anchor="middle" font-size="11.5" fill="#5b6475">+ anten, dưới nắp kim loại</text>
  <text x="380" y="242" text-anchor="middle" font-size="11.5" fill="#5b6475">Ví dụ: ESP32-WROOM-32E</text>
  <!-- 3. DevKit -->
  <rect x="536" y="52" width="200" height="210" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <rect x="574" y="84" width="124" height="58" rx="4" fill="#1c2433"/>
  <rect x="562" y="104" width="14" height="18" rx="2" fill="#9aa3ae"/>
  <rect x="614" y="94" width="48" height="38" rx="2" fill="#d5d9df"/>
  <g fill="#d4a017">
    <circle cx="584" cy="89" r="2"/><circle cx="599" cy="89" r="2"/><circle cx="614" cy="89" r="2"/><circle cx="629" cy="89" r="2"/><circle cx="644" cy="89" r="2"/><circle cx="659" cy="89" r="2"/><circle cx="674" cy="89" r="2"/><circle cx="689" cy="89" r="2"/>
    <circle cx="584" cy="137" r="2"/><circle cx="599" cy="137" r="2"/><circle cx="614" cy="137" r="2"/><circle cx="629" cy="137" r="2"/><circle cx="644" cy="137" r="2"/><circle cx="659" cy="137" r="2"/><circle cx="674" cy="137" r="2"/><circle cx="689" cy="137" r="2"/>
  </g>
  <text x="636" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2433">3. DevKit (bo mạch)</text>
  <text x="636" y="206" text-anchor="middle" font-size="11.5" fill="#5b6475">Module + cổng USB</text>
  <text x="636" y="222" text-anchor="middle" font-size="11.5" fill="#5b6475">+ nút BOOT/EN + chân cắm</text>
  <text x="636" y="242" text-anchor="middle" font-size="11.5" fill="#5b6475">Ví dụ: ESP32 DevKit V1</text>
  <text x="636" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">↑ Học sinh mua cái này</text>
</svg>
